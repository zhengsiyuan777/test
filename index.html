<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>廉洁人格六边形趣味心理测评</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<!-- 分享二维码已内联为 base64 图片，兼容微信等所有浏览器，不依赖外链 -->
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Serif SC", serif;
    min-height: 100vh;
    color: #2c2416;
    background:
      radial-gradient(circle at 15% 10%, rgba(201, 162, 74, 0.18), transparent 42%),
      radial-gradient(circle at 85% 8%, rgba(139, 90, 43, 0.15), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(160, 82, 45, 0.18), transparent 45%),
      linear-gradient(180deg, #fbf6ea 0%, #f3ead3 45%, #ecdfc2 100%);
    background-attachment: fixed;
    padding: 32px 16px;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    background: rgba(255, 252, 245, 0.88);
    border: 1px solid rgba(139, 90, 43, 0.25);
    border-radius: 24px;
    padding: 36px 28px;
    box-shadow:
      0 20px 50px rgba(80, 50, 20, 0.18),
      0 0 0 1px rgba(255, 255, 255, 0.6) inset;
    backdrop-filter: blur(8px);
  }
  h1 {
    text-align: center;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #3b2f1a;
    margin-bottom: 10px;
  }
  .subtitle {
    text-align: center;
    font-size: 14px;
    color: #7a6a4a;
    margin-bottom: 24px;
    letter-spacing: 1px;
  }
  .seal {
    display: inline-block;
    background: #a0522d;
    color: #fbf6ea;
    padding: 8px 18px;
    border-radius: 12px;
    font-size: 13px;
    letter-spacing: 6px;
    font-weight: 700;
    margin-bottom: 18px;
    box-shadow: 0 8px 20px rgba(160, 82, 45, 0.35);
  }
  .tip {
    background: rgba(255, 248, 230, 0.9);
    border: 1px solid rgba(201, 162, 74, 0.35);
    border-left: 4px solid #c9a24a;
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 28px;
    font-size: 14px;
    line-height: 1.9;
    color: #5a4a28;
  }
  .progress-card {
    background: rgba(255, 252, 245, 0.9);
    border: 1px solid rgba(139, 90, 43, 0.22);
    border-radius: 18px;
    padding: 18px 22px;
    margin-bottom: 24px;
    box-shadow: 0 10px 24px rgba(80, 50, 20, 0.08);
  }
  .progress-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 14px;
    color: #5a4a28;
  }
  .progress-head span {
    font-weight: 700;
  }
  .progress-bar {
    width: 100%;
    height: 10px;
    background: rgba(139, 90, 43, 0.12);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid rgba(139, 90, 43, 0.18);
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #c9a24a, #a0522d);
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .q {
    background: rgba(255, 252, 245, 0.92);
    border: 1px solid rgba(139, 90, 43, 0.22);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 10px 24px rgba(80, 50, 20, 0.08);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .q:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(80, 50, 20, 0.12);
  }
  .q-title {
    font-size: 16px;
    font-weight: 700;
    color: #3b2f1a;
    margin-bottom: 14px;
    line-height: 1.8;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .q-index {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    background: linear-gradient(135deg, #8b5a2b, #a0522d);
    color: #fbf6ea;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    box-shadow: 0 6px 14px rgba(139, 90, 43, 0.35);
  }
  .opt {
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(139, 90, 43, 0.22);
    border-radius: 14px;
    padding: 16px 16px;
    margin-bottom: 10px;
    font-size: 14.5px;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    gap: 12px;
    color: #4a3a20;
  }
  .opt:hover {
    border-color: #c9a24a;
    background: rgba(201, 162, 74, 0.08);
    transform: translateX(4px);
  }
  .opt input {
    accent-color: #a0522d;
    width: 22px;
    height: 22px;
    cursor: pointer;
  }
  .btn-box {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 34px;
    flex-wrap: wrap;
  }
  .btn {
    border: none;
    padding: 14px 34px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.25s ease;
  }
  .btn-submit {
    background: linear-gradient(135deg, #8b5a2b, #a0522d);
    color: #fbf6ea;
    box-shadow: 0 14px 30px rgba(139, 90, 43, 0.4);
  }
  .btn-submit:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 36px rgba(139, 90, 43, 0.5);
  }
  .btn-reset {
    background: rgba(255, 252, 245, 0.9);
    color: #5a4a28;
    border: 1px solid rgba(139, 90, 43, 0.3);
  }
  .btn-reset:hover {
    background: rgba(201, 162, 74, 0.12);
    transform: translateY(-3px);
  }
  .btn-back {
    background: #e8edf4;
    color:#44546a;
    border:1px solid #bbc8dd;
  }
  .btn-share{
    background:#406894;
    color:#fff;
  }
  .btn-small{
    padding:8px 18px;font-size:14px;
  }
  #res {
    display: none;
    margin-top: 40px;
  }
  .res-head {
    text-align: center;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #3b2f1a;
    margin-bottom: 8px;
  }
  .res-sub {
    text-align: center;
    font-size: 14px;
    color: #7a6a4a;
    margin-bottom: 28px;
    letter-spacing: 1px;
  }
  .chart-box {
    width: 100%;
    max-width: 480px;
    margin: 0 auto 32px auto;
    background: rgba(255, 252, 245, 0.9);
    border: 1px solid rgba(139, 90, 43, 0.22);
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 14px 30px rgba(80, 50, 20, 0.12);
  }
  .score-list{
    background:#fff9ec;
    border-radius:16px;
    padding:18px;
    margin-bottom:24px;
    border:1px solid #e2d4b8;
  }
  .score-item{
    display:flex;justify-content:space-between;padding:6px 0;
    border-bottom:1px dashed #ddd2bc;
  }
  .score-item:last-child{border-bottom:none;}
  .case-card,
  .good-card,
  .suggest-card {
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 20px;
    line-height: 1.9;
    font-size: 14.5px;
  }
  .case-card {
    background: rgba(255, 240, 240, 0.9);
    border: 1px solid rgba(197, 60, 60, 0.25);
    border-left: 5px solid #c53c3c;
    color: #5a2020;
  }
  .good-card {
    background: rgba(240, 250, 245, 0.9);
    border: 1px solid rgba(42, 148, 98, 0.25);
    border-left: 5px solid #2a9462;
    color: #1f4d35;
  }
  .suggest-card {
    background: rgba(255, 248, 230, 0.9);
    border: 1px solid rgba(201, 162, 74, 0.3);
    border-left: 5px solid #c9a24a;
    color: #5a4418;
  }
  .warn-text {
    margin-top: 14px;
    color: #b53030;
    font-weight: 700;
  }
  .summary {
    background: rgba(240, 245, 250, 0.9);
    border: 1px solid rgba(116, 148, 200, 0.3);
    border-radius: 18px;
    padding: 18px;
    color: #44546a;
    font-size: 14px;
    line-height: 1.9;
  }
  .no-chart-tip{
    text-align:center;padding:20px;color:#888;
  }
  /*分享弹窗*/
  .mask{
    position:fixed;inset:0;background:rgba(60,38,8,0.55);z-index:999;display:none;align-items:center;justify-content:center;padding:16px;
    backdrop-filter: blur(3px);
  }
  .share-modal{
    position:relative;
    width:100%;max-width:480px;
    background:linear-gradient(180deg,#fffdf7 0%,#fdf6e8 100%);
    border:1px solid rgba(139,90,43,0.22);
    border-radius:22px;
    padding:30px 26px 24px;
    max-height:92vh;overflow-y:auto;
    box-shadow:0 28px 70px rgba(60,35,5,0.35);
  }
  .share-close{
    position:absolute;top:14px;right:14px;
    width:30px;height:30px;border:none;border-radius:50%;
    background:rgba(139,90,43,0.1);color:#7a5a30;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
    transition:background .2s ease;
  }
  .share-close:hover{background:rgba(139,90,43,0.22);}
  .share-modal-title{
    text-align:center;font-size:20px;font-weight:800;color:#3b2f1a;
    letter-spacing:2px;margin-bottom:6px;
  }
  .share-modal-sub{
    text-align:center;font-size:13px;color:#8a7a5a;margin-bottom:22px;line-height:1.7;
  }
  .share-link-card{
    background:#fff;border:1px solid #eadfc6;border-radius:14px;padding:14px 16px;margin-bottom:12px;
    box-shadow:0 4px 14px rgba(139,90,43,0.06);
  }
  .share-link-label{font-size:13px;font-weight:700;color:#5a4a28;margin-bottom:8px;}
  .share-link-url{display:flex;align-items:center;gap:12px;}
  .share-link-url .url-text{flex:1;font-size:12px;color:#8a7a5a;word-break:break-all;line-height:1.6;}
  .btn-copy{
    flex-shrink:0;border:none;background:linear-gradient(135deg,#8b5a2b,#a0522d);color:#fff;
    border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 14px rgba(139,90,43,0.25);
    transition:transform .2s ease;
  }
  .btn-copy:hover{transform:translateY(-1px);}
  textarea.copy-textarea{
    width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px dashed #d8c8a8;
    background:#fbf7ec;color:#8a7a5a;font-size:12px;margin-bottom:16px;resize:none;
  }
  .btn-gen-image{
    width:100%;border:none;background:linear-gradient(135deg,#8b5a2b,#a0522d);color:#fff;
    border-radius:14px;padding:14px;font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer;
    box-shadow:0 12px 26px rgba(139,90,43,0.35);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn-gen-image:hover{transform:translateY(-2px);box-shadow:0 16px 30px rgba(139,90,43,0.4);}
  .share-preview-tip{
    text-align:center;font-size:12px;color:#a0906c;margin:12px 0 4px;
  }
  #shareCanvasWrap{
    background:transparent;padding:6px 0 2px;border-radius:12px;
    display:none;
  }
  .share-preview-card{
    background:#fff9ec;border:1px solid #d8c8a8;border-radius:16px;padding:20px;margin:12px 0;
  }
  .share-link-box{
    background:#efeadc;padding:10px;border-radius:8px;font-size:13px;margin:10px 0;
  }
  /*分享预览页面（被别人点开分享链接）*/
  #sharePreviewPage{
    display:none;
  }
  @media (max-width: 640px) {
    .wrap {
      padding: 24px 18px;
    }
    h1 {
      font-size: 24px;
    }
    .q-title {
      font-size: 15px;
    }
    .btn {
      width: 100%;
    }
  }
  @media print {
    body{background:#fff;padding:0;}
    .wrap{box-shadow:none;border:none;background:#fff;max-width:100%;padding:10px;}
    .btn-box,.tip,.progress-card{display:none !important;}
    .q{display:none !important;}
    #res{display:block !important;margin:0;}
    .mask{display:none !important;}
    #sharePreviewPage{display:block !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- 分享预览页面：别人点开分享链接，先看这个，无作答表单 -->
  <div id="sharePreviewPage">
    <div class="text-center mb-6">
      <span class="seal px-4 py-2 rounded-full">他人测评分享预览</span>
    </div>
    <div class="share-preview-card" id="sharePreviewContent"></div>
    <div class="btn-box">
      <button class="btn btn-submit" onclick="hideSharePreview()">👉 参与本测评</button>
    </div>
  </div>
  <!--正常测评页面 -->
  <div id="mainTestPage">
    <h1>廉洁人格六边形趣味心理测评</h1>
    <p class="subtitle">—— 防微杜渐 · 慎独慎微 ——</p>
    <div style="text-align:center;">
      <span class="seal">廉 政 风 险 自 测</span>
    </div>
    <div class="tip">
      <strong>测试说明：</strong>轻松趣味人格测试，无考核、无对错！<br>
      凭第一直觉选择最贴合你心态的选项，测出你的廉洁人格风险六边形。<br>
      <span style="color:#a0522d;">⚠ 选项已随机打乱，请按真实想法作答。作答会本地保存，刷新页面可恢复。</span>
    </div>
    <div class="progress-card">
      <div class="progress-head">
        <span>📜 答题进度</span>
        <span id="progressText">0 / 18</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressBar"></div>
      </div>
    </div>
    <div id="qList"></div>
    <div class="btn-box">
      <button id="submitBtn" class="btn btn-submit" onclick="calc()">生成六边形测评结果</button>
      <button class="btn btn-reset" onclick="clearAllAnswer()">清空所有答案</button>
    </div>
    <div id="res">
      <div class="res-head">你的廉洁人格风险图谱</div>
      <p class="res-sub">基于六大廉洁风险维度心理倾向测评</p>
      <div class="chart-box">
        <div id="chartWrap"></div>
      </div>
      <div id="scoreBox" class="score-list"></div>
      <div id="resultContent"></div>
      <div class="btn-box">
        <button class="btn btn-back" onclick="backToQuestion()">返回答题页（保留作答）</button>
        <button class="btn btn-reset" onclick="clearAllAnswer()">重新测评（清空答案）</button>
        <button class="btn btn-share" onclick="openShareModal()">📤分享测评结果</button>
      </div>
    </div>
  </div>
</div>
<!--分享弹窗mask -->
<div class="mask" id="shareMask" onclick="closeShareModalByMask(event)">
  <div class="share-modal" onclick="event.stopPropagation()">
    <button class="share-close" onclick="closeShareModal()" aria-label="关闭">✕</button>
    <h3 class="share-modal-title">分享我的测评结果</h3>
    <p class="share-modal-sub">生成专属分享图片或复制链接<br>发给好友一起测测吧</p>
    <div class="share-link-card">
      <p class="share-link-label">🔗 分享链接</p>
      <div class="share-link-url">
        <span class="url-text" id="shareLinkText">点击下方复制按钮获取完整分享链接</span>
        <button class="btn-copy" onclick="copyShareLink()">复制链接</button>
      </div>
    </div>
    <textarea id="copyTextarea" class="copy-textarea" readonly></textarea>
    <button class="btn-gen-image" onclick="genShareImage()">📤 生成分享图片</button>
    <p class="share-preview-tip">生成的图片显示在下方，长按或点击保存即可分享</p>
    <div id="shareCanvasWrap"></div>
  </div>
</div>
<script>
// 18道题目原始数据
const questionData = [
  {
    qid:"q1",
    title:"看着身边朋友、同龄人赚钱轻松、生活精致，对比自己安稳枯燥的工作，偶尔会有点心里不平衡。",
    opts:[
      {val:1,text:"完全不会，心态很稳"},
      {val:2,text:"偶尔感慨一下，转瞬就忘"},
      {val:3,text:"经常会有点羡慕、不甘心"},
      {val:4,text:"落差感很强，总觉得自己亏了"}
    ]
  },
  {
    qid:"q2",
    title:"自己踏实干活多年，付出很多却没得到对等回报，会萌生“我该多为自己捞点补偿”的想法。",
    opts:[
      {val:1,text:"从未有过，踏实本分"},
      {val:2,text:"偶尔吐槽，不会当真"},
      {val:3,text:"心里时常觉得不公平"},
      {val:4,text:"强烈觉得自己值得更好的回报"}
    ]
  },
  {
    qid:"q3",
    title:"偶尔会觉得，自己岗位辛苦责任大，适当利用现有资源便利一下自己，也不算过分。",
    opts:[
      {val:1,text:"完全不认同，公私分明"},
      {val:2,text:"偶尔一闪而过，立刻否定"},
      {val:3,text:"有点认同，能理解这种想法"},
      {val:4,text:"非常认同，理所应当"}
    ]
  },
  {
    qid:"q4",
    title:"日常一些无伤大雅的小变通、小便利，只要没人刻意深究，基本不会出问题。",
    opts:[
      {val:1,text:"绝不侥幸，依规做事"},
      {val:2,text:"偶尔这么想，但不会做"},
      {val:3,text:"经常抱有这种想法"},
      {val:4,text:"笃定小事没人管、没人查"}
    ]
  },
  {
    qid:"q5",
    title:"看到身边人灵活办事获利且平安无事，会降低自己对规则的警惕心。",
    opts:[
      {val:1,text:"不受影响，坚守底线"},
      {val:2,text:"稍微动摇，很快清醒"},
      {val:3,text:"会羡慕，觉得规则可灵活变通"},
      {val:4,text:"心态彻底放松，觉得不用太较真"}
    ]
  },
  {
    qid:"q6",
    title:"只要做事隐蔽、不留痕迹，稍微突破一点规矩，完全可以蒙混过关。",
    opts:[
      {val:1,text:"坚决不信，敬畏监督"},
      {val:2,text:"偶尔幻想，绝不实践"},
      {val:3,text:"觉得有一定可行性"},
      {val:4,text:"深信只要隐蔽就不会出事"}
    ]
  },
  {
    qid:"q7",
    title:"亲戚、老友、老同事开口求助，哪怕稍微越界，也不好意思直接拒绝伤感情。",
    opts:[
      {val:1,text:"原则优先，果断拒绝"},
      {val:2,text:"有点为难，但坚守原则"},
      {val:3,text:"大概率会心软帮忙"},
      {val:4,text:"极度抹不开面子，基本有求必应"}
    ]
  },
  {
    qid:"q8",
    title:"长期合作、关系要好的熟人，会下意识觉得可以适当通融，不用死抠制度。",
    opts:[
      {val:1,text:"公私分明，一视同仁"},
      {val:2,text:"偶尔松动，绝不破例"},
      {val:3,text:"会优先照顾熟人情面"},
      {val:4,text:"熟人特权理所应当"}
    ]
  },
  {
    qid:"q9",
    title:"日常吃请、小礼物、人情往来，觉得都是普通社交，没必要上纲上线。",
    opts:[
      {val:1,text:"清晰边界，主动规避"},
      {val:2,text:"平常心看待，保持距离"},
      {val:3,text:"觉得都是小事，无需介意"},
      {val:4,text:"完全不在意，习以为常"}
    ]
  },
  {
    qid:"q10",
    title:"经常羡慕精致奢华的生活，希望自己能大幅提升消费档次和生活品质。",
    opts:[
      {val:1,text:"知足常乐，不慕浮华"},
      {val:2,text:"偶尔羡慕，不刻意追求"},
      {val:3,text:"很向往，想努力追赶"},
      {val:4,text:"极度渴望高品质享乐生活"}
    ]
  },

//数组打乱
function shuffle(arr){
  const temp = [...arr];
  for(let i=temp.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [temp[i],temp[j]] = [temp[j],temp[i]];
  }
  return temp;
}
//保存答案到localStorage
function saveAnswerToLocal(){
  const obj = {};
  questionData.forEach(q=>{
    const el = document.querySelector(`input[name="${q.qid}"]:checked`);
    if(el) obj[q.qid] = el.value;
  })
  localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
}
//读取本地答案回填
function restoreAnswerFromLocal(){
  const str = localStorage.getItem(STORAGE_KEY);
  if(!str) return;
  try{
    const obj = JSON.parse(str);
    for(const key in obj){
      const radio = document.querySelector(`input[name="${key}"][value="${obj[key]}"]`);
      if(radio) radio.checked = true;
    }
  }catch(e){}
}
//渲染题目，索引生成题号
function renderQuestions(){
  const wrap = document.getElementById("qList");
  wrap.innerHTML = "";
  questionData.forEach((q,idx)=>{
    const shuffledOpts = shuffle(q.opts);
    const qDiv = document.createElement("div");
    qDiv.className = "q";
    qDiv.innerHTML = `
      <div class="q-title">
        <span class="q-index">${idx+1}</span>
        <span>${q.title}</span>
      </div>
      ${shuffledOpts.map(opt=>`
        <label class="opt">
          <input type="radio" name="${q.qid}" value="${opt.val}" onchange="handleOptionChange()">
          <span>${opt.text}</span>
        </label>
      `).join("")}
    `;
    wrap.appendChild(qDiv);
  })
  restoreAnswerFromLocal();
  updateProgress();
}
function handleOptionChange(){
  updateProgress();
  saveAnswerToLocal();
}
//更新进度
function updateProgress(){
  let count = 0;
  for(let i=1;i<=18;i++){
    if(document.querySelector(`input[name="q${i}"]:checked`)) count++;
  }
  document.getElementById("progressText").innerText = `${count} / 18`;
  document.getElementById("progressBar").style.width = (count/18*100)+"%";
}
//清空全部作答，清除本地存储
function clearAllAnswer(){
  localStorage.removeItem(STORAGE_KEY);
  document.querySelectorAll('input[type="radio"]').forEach(r=>r.checked=false);
  updateProgress();
  document.getElementById("res").style.display="none";
}
//返回答题页，保留作答

      content += `<h3 style="margin-bottom:12px;color:#c53c3c;">⚠️ 本次测评核心风险维度（并列共${topDimList.length}项）</h3>`;
      topDimList.forEach(item=>{
        let caseShow;
        const s = item.score;
        if(s <=4) caseShow = item.dim.caseLow;
        else if(s <=8) caseShow = item.dim.caseMid;
        else caseShow = item.dim.caseHigh;
        content += `
        <div class="case-card">
          <h3 class="case-title">${item.dim.name}（得分${item.score}/12）</h3>
          <p><strong>心理特征：</strong>${item.dim.psych}</p>
          <p style="margin-top:8px;"><strong>国网系统对标警示案例：</strong>${caseShow}</p>
          <div class="suggest-card">
              <strong>✅ 正向改进鼓励：</strong>${item.dim.improve}
          </div>
          <div class="warn-text">
              <strong>❗ 底线警示提醒：</strong>${item.dim.warn}
          </div>
        </div>
        `;
      })
    }
    content += `
    <div class="summary">
    <strong>测评小结：</strong>本测试为趣味心理倾向自测，仅用于自我觉察、正向纠偏。人人都有细微人格倾向，及时发现、主动整改、坚守本心，就能终身守住底线、安稳前行！
    </div>
    `;
    document.getElementById("resultContent").innerHTML = content;
    document.getElementById("res").style.display="block";
    window.scrollTo({top:document.getElementById("res").offsetTop-40,behavior:"smooth"});
  },200);
}
//Chart.js加载失败降级
function renderChartSafe(scores){
  const wrap = document.getElementById("chartWrap");
  if(typeof Chart === "undefined"){
    wrap.innerHTML = `<div class="no-chart-tip">⚠️ 图表组件加载失败，仅文本结果可用</div>`;
    return;
  }
  wrap.innerHTML = `<canvas id="radarChart"></canvas>`;
  const ctx = document.getElementById('radarChart').getContext('2d');
  if(chartIns) chartIns.destroy();
  const labels = dimConfig.map(d=>d.label);
  chartIns = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: labels,
      datasets: [{
        label: "个人风险指数",
        data: scores,
        backgroundColor: "rgba(116, 148, 200, 0.2)",
        borderColor: "rgba(116, 148, 200, 0.8)",
        borderWidth:2,
        pointBackgroundColor:"#7494c8"
      }]
    },
    options: {
      scales:{
        r:{
          min:0,max:12,
          ticks:{display:false},
          grid:{color:"rgba(200,210,230,0.4)"},
          pointLabels:{
            font:{size:12}
          }
        }
      },
      plugins:{legend:{display:true,position:"top"}}
    }
  })
}

}

async function copyShareLink(){
  try{
    await navigator.clipboard.writeText(shareUrl);

  }
}

      useCORS:true,
      backgroundColor:"#fffbf1",
      scale: window.devicePixelRatio || 2,
      logging:false
    });

    if(isWeChatBrowser){
      alert("微信浏览器不支持直接下载！请长按下方图片，保存到相册");
      // 微信端将 canvas 转为 img，长按才能弹出保存图片菜单
      const shareImg = new Image();
      shareImg.src = canvas.toDataURL("image/png");
      shareImg.style.width = "100%";
      shareImg.style.maxWidth = "420px";
      shareImg.style.display = "block";
      shareImg.style.margin = "0 auto";
      shareImg.style.borderRadius = "12px";
      canvasWrap.innerHTML = "";
      canvasWrap.appendChild(shareImg);
    }else{
      const a = document.createElement("a");
      a.download = "廉洁测评分享.png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    }
  }catch(e){
    console.error("生成图片失败",e);
    alert("生成分享图片失败，请直接复制链接分享");
  }
}

//解析url分享参数：读取数字索引，反查维度名称与改进文本
function parseShareQuery(){
  const params = new URLSearchParams(location.search);
  const isShare = params.get("share");
  if(isShare !== "1") return false;
  const idxRaw = params.get("idx");
  const scoresRaw = params.get("s");
  if(!idxRaw || !scoresRaw) return false;
  const idxArr = idxRaw.split(",").map(Number);
  const scoresArr = scoresRaw.split(",").map(Number);
  const topNames = [];
  const improveList = [];
  idxArr.forEach(num=>{
    if(dimConfig[num]){
      topNames.push(dimConfig[num].name);
      improveList.push(dimConfig[num].improve);
    }
  });
  document.getElementById("mainTestPage").style.display="none";
  document.getElementById("sharePreviewPage").style.display="block";
  const previewDom = document.getElementById("sharePreviewContent");
  previewDom.innerHTML = `
  <h4 style="margin-bottom:10px">👤他人测评结果预览（仅脱敏分享内容）</h4>
  <p><strong>核心风险人格：</strong>${topNames.join("；")}</p>
  <p style="margin:8px 0;"><strong>六大维度得分(满分12)：</strong>${scoresArr.map(s=>`${s}/12`).join("，")}</p>
  <div style="margin-top:10px;">
    <strong>改进提升方向：</strong>
    <div>${improveList.map(s=>`<div>•${s}</div>`).join("")}</div>
  </div>
  <div style="margin-top:12px;padding:10px;background:#fff3e0;border-radius:8px;">
    <p>⚠提示：该页面仅为他人分享预览，<b>不含原始警示案例</b>。点击下方按钮进入完整测评，测测你自己。</p>
  </div>
  `;
  return true;
}

//从分享预览切回主测评页面
function hideSharePreview(){
  history.replaceState({},document.title,location.pathname);
  document.getElementById("sharePreviewPage").style.display="none";
  document.getElementById("mainTestPage").style.display="block";
  renderQuestions();
}

window.onload = function(){
  const isShareMode = parseShareQuery();
  if(!isShareMode){
    renderQuestions();
  }
}
</script>
